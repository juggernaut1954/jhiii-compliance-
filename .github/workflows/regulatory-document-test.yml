name: ARA Regulatory Document Test

on:
  workflow_dispatch:
    inputs:
      document_number:
        description: "Federal Register document number"
        required: true
        default: "2026-12460"
        type: string

permissions:
  contents: read

jobs:
  document-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DOCUMENT_NUMBER: ${{ inputs.document_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Test regulatory document worker
        run: |
          python -m app.regulatory_document_worker "$DOCUMENT_NUMBER"

      - name: Save retrieved regulatory document
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-document-${{ inputs.document_number }}
          path: federal_register_${{ inputs.document_number }}.json
          if-no-files-found: error
          retention-days: 7
