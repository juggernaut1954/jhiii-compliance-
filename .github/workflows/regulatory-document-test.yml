
name: ARA Regulatory Document Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Test regulatory document worker
        run: |
          python -m app.regulatory_document_worker 2026-00449

      - name: Save retrieved regulatory document
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-document-2026-00449
          path: federal_register_2026-00449.json
          if-no-files-found: error
          retention-days: 7
